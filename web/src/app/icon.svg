<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Golden Bee Body & Wings Favicon -->
  <g transform="translate(50, 50) scale(0.9)">
    <!-- Wings -->
    <path d="M -8 -8 C -24 -36, -46 -24, -28 -4 C -20 2, -10 0, -8 -8 Z" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5" />
    <path d="M 8 -8 C 24 -36, 46 -24, 28 -4 C 20 2, 10 0, 8 -8 Z" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5" />
    <!-- Secondary Small Wings -->
    <path d="M -6 4 C -22 18, -32 30, -18 28 C -10 26, -6 14, -6 4 Z" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" />
    <path d="M 6 4 C 22 18, 32 30, 18 28 C 10 26, 6 14, 6 4 Z" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" />
    <!-- Abdomen Oval (Golden Stripes) -->
    <ellipse cx="0" cy="12" rx="14" ry="22" fill="#f59e0b" stroke="#d97706" stroke-width="2" />
    <!-- Dark Stripes -->
    <path d="M -13 4 Q 0 8 13 4" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M -14 12 Q 0 16 14 12" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M -12 20 Q 0 24 12 20" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <!-- Stinger -->
    <polygon points="0,34 -3,39 3,39" fill="#1e293b" />
    <!-- Head & Eyes -->
    <circle cx="0" cy="-14" r="9" fill="#f59e0b" stroke="#d97706" stroke-width="2" />
    <circle cx="-4" cy="-16" r="2" fill="#1e293b" />
    <circle cx="4" cy="-16" r="2" fill="#1e293b" />
    <!-- Antennae -->
    <path d="M -3 -22 Q -8 -28 -12 -26" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 3 -22 Q 8 -28 12 -26" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>
</svg>
